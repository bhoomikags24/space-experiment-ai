<!DOCTYPE html>
<html>

<head>

    <title>Space Experiment AI - Setup</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef4ff;
        }

        .setup-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .setup-card {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .setup-logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #173b7a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid #ccd6e5;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2864d7;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2864d7;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #174fae;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .success {
            color: #16803c;
        }

        .error {
            color: #c62828;
        }

    </style>

</head>


<body>


<div class="setup-container">


    <div class="setup-card">


        <div class="setup-logo">
            🚀
        </div>


        <h1>
            Space Experiment AI
        </h1>


        <p class="subtitle">
            Experiment Setup
        </p>


        <!-- EXPERIMENT ID -->

        <label for="experimentId">
            🧪 Experiment ID
        </label>

        <input
            type="text"
            id="experimentId"
            placeholder="Example: EXP001"
        >


        <!-- PARTICIPANT ID -->

        <label for="participantId">
            👤 Participant ID
        </label>

        <input
            type="text"
            id="participantId"
            placeholder="Example: P001"
        >


        <!-- START BUTTON -->

        <button onclick="startExperiment()">
            🚀 Start Experiment
        </button>


        <div id="message"></div>


    </div>

</div>



<script>


async function startExperiment() {


    const experimentId =
        document.getElementById(
            "experimentId"
        ).value.trim();


    const participantId =
        document.getElementById(
            "participantId"
        ).value.trim();


    const message =
        document.getElementById(
            "message"
        );


    /* ========================= */
    /* VALIDATION */
    /* ========================= */

    if (
        experimentId === "" ||
        participantId === ""
    ) {

        message.innerText =
            "⚠️ Please enter both Experiment ID and Participant ID.";

        message.className = "error";

        return;

    }


    try {


        /* ========================= */
        /* SEND SETUP TO BACKEND */
        /* ========================= */

        const response =
            await fetch(
                "http://127.0.0.1:8000/setup",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                        "application/json"
                    },

                    body: JSON.stringify({

                        experiment_id:
                            experimentId,

                        participant_id:
                            participantId

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                "Setup failed"
            );

        }


        /* ========================= */
        /* SUCCESS MESSAGE */
        /* ========================= */

        message.innerText =
            "✅ Experiment setup completed!";

        message.className =
            "success";


        /* ========================= */
        /* OPEN DASHBOARD */
        /* ========================= */

        setTimeout(
            function() {

                window.location.href =
                    "dashboard.html";

            },
            800
        );


    }


    catch (error) {

        console.error(error);


        message.innerText =
            "❌ Cannot connect to backend. Please start FastAPI.";

        message.className =
            "error";

    }

}


</script>


</body>

</html>
