<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Missionmind AI - Space Experiment</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #071426;
            color: white;
        }

        header {
            background: #0d2340;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            color: #4da6ff;
        }

        header p {
            margin: 8px 0 0;
            color: #b8c7d9;
        }

        .status {
            margin: 20px auto;
            max-width: 900px;
            padding: 15px;
            border-radius: 10px;
            background: #102d4d;
            text-align: center;
            font-size: 18px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .card {
            background: #10243b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #21476e;
        }

        .card h3 {
            margin-top: 0;
            color: #69b7ff;
        }

        .value {
            font-size: 24px;
            font-weight: bold;
        }

        .steps {
            margin-top: 25px;
            background: #10243b;
            padding: 20px;
            border-radius: 12px;
        }

        .step {
            padding: 12px;
            margin: 8px 0;
            background: #173451;
            border-radius: 8px;
        }

        .connected {
            color: #4dff88;
        }

        .error {
            color: #ff6464;
        }
    </style>
</head>

<body>

<header>
    <h1>🚀 Missionmind AI</h1>
    <p>AI-Based Activity Recognition for Space Experiments</p>
</header>

<div class="status">
    Backend:
    <strong id="connectionStatus">Connecting...</strong>
</div>

<div class="container">

    <div class="cards">

        <div class="card">
            <h3>Experiment ID</h3>
            <div class="value" id="experimentId">-</div>
        </div>

        <div class="card">
            <h3>Participant</h3>
            <div class="value" id="participantId">-</div>
        </div>

        <div class="card">
            <h3>Current Activity</h3>
            <div class="value" id="currentActivity">-</div>
        </div>

        <div class="card">
            <h3>Current Step</h3>
            <div class="value" id="currentStep">-</div>
        </div>

        <div class="card">
            <h3>Status</h3>
            <div class="value" id="status">-</div>
        </div>

        <div class="card">
            <h3>Confidence</h3>
            <div class="value" id="confidence">0%</div>
        </div>

    </div>

    <div class="steps">

        <h2>Experiment Monitoring</h2>

        <div class="step">
            Expected Activity:
            <strong id="expectedActivity">-</strong>
        </div>

        <div class="step">
            Backend Connection:
            <strong id="connectionDetails">Checking...</strong>
        </div>

    </div>

</div>

<script>

const API_URL = "https://space-experiment-ai.onrender.com";

async function connectBackend() {

    const connectionStatus =
        document.getElementById("connectionStatus");

    const connectionDetails =
        document.getElementById("connectionDetails");

    try {

        const response =
            await fetch(API_URL + "/status");

        if (!response.ok) {
            throw new Error("Backend error");
        }

        const data =
            await response.json();

        connectionStatus.textContent =
            "Connected successfully";

        connectionStatus.className =
            "connected";

        connectionDetails.textContent =
            data.status || "Backend connected successfully";

        connectionDetails.className =
            "connected";

    } catch (error) {

        console.error(error);

        connectionStatus.textContent =
            "Cannot connect to backend";

        connectionStatus.className =
            "error";

        connectionDetails.textContent =
            "Backend connection failed";

        connectionDetails.className =
            "error";
    }
}


async function loadExperiment() {

    try {

        const response =
            await fetch(API_URL + "/experiment");

        if (!response.ok) {
            throw new Error("Experiment API error");
        }

        const data =
            await response.json();

        document.getElementById("experimentId").textContent =
            data.experiment_id || "EXP001";

        document.getElementById("participantId").textContent =
            data.participant_id || "P001";

        document.getElementById("currentActivity").textContent =
            data.current_activity || "-";

        document.getElementById("currentStep").textContent =
            (data.current_step || 1) +
            "/" +
            (data.total_steps || 5);

        document.getElementById("status").textContent =
            data.status || "WAITING";

        document.getElementById("confidence").textContent =
            ((data.confidence || 0) * 100).toFixed(1) + "%";

        document.getElementById("expectedActivity").textContent =
            data.expected_activity || "-";

    } catch (error) {

        console.error(
            "Experiment loading error:",
            error
        );

    }
}


async function refreshDashboard() {

    await connectBackend();

    await loadExperiment();

}


refreshDashboard();

setInterval(refreshDashboard, 3000);

</script>

</body>
</html>
